name: Update README directory tree

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Generate tree
        run: |
          tree -I 'py.typed|.git|dsa.egg-info|pyproject.toml|requirements.txt|__init__.py|dist|build|__pycache__|.venv|tree_output.txt' -F --dirsfirst --noreport > tree_output.txt

      - name: Update README
        run: |
          python3 - <<'EOF'
          import re

          with open("tree_output.txt") as f:
              tree_content = f.read().strip()

          with open("README.md") as f:
              readme = f.read()

          new_block = f"<!-- TREE_START -->\n```\n{tree_content}\n```\n<!-- TREE_END -->"

          updated = re.sub(
              r"<!-- TREE_START -->.*<!-- TREE_END -->",
              new_block,
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(updated)
          EOF

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update directory tree in README [skip ci]"
          git push
